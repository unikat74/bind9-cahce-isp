/var/log/named/security.log /var/log/named/rpz.log {
    daily
    maxsize 20M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d-%H%M%S
    create 0640 bind bind
    su bind bind
    sharedscripts
    postrotate
        /usr/sbin/rndc reconfig
    endscript
}
